#Q: Quel type de ressource kubernetes doit-il créer ?
#R: Une ressource (kind) de type "Deployment" qui a pour nom "nginx" doit être créée en utilisant l'API Kubernetes "apps/v1"
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
#Q: Quelles specifications cette ressource doit-elle avoir ?
#R: Cette ressource doit gérer 2 pods dont le label "app" doit matcher avec "reverse-proxy"
spec:
  replicas: 2
  selector:
    matchLabels:
      app: reverse-proxy
#Q: Que doit contenir les pods gérés par cette ressource Deployment ?
#R: Les pods sont créés avec le label "app: reverse-proxy" afin que le Deployment puisse les retrouver avec son selector matchLabels
# Les pods contiennent 1 container nommé "nginx" qui utilise l'image du DockerHub "nginx" dans sa version "1.27.1-alpine"
  template:
    metadata:
      labels:
        app: reverse-proxy
    spec:
      containers:
      - name: nginx
        image: nginx:1.27.1-alpine
        ports:
        - containerPort: 80
        # Partie 2 : montage du fichier default.conf fourni par la ConfigMap nginx-cm
        volumeMounts:
        - name: nginx-conf
          mountPath: /etc/nginx/conf.d
      volumes:
      - name: nginx-conf
        configMap:
          name: nginx-cm
