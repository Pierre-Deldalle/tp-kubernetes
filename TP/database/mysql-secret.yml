# Secret contenant les mots de passe MySQL (valeurs encodées en base64)
# echo -n 'wppassword'   | base64  -> d3BwYXNzd29yZA==
# echo -n 'rootpassword' | base64  -> cm9vdHBhc3N3b3Jk
# Pas de namespace dans les metadata : il est passé avec -n (database puis middle)
apiVersion: v1
kind: Secret
metadata:
  name: mysql-secret
type: Opaque
data:
  MYSQL_PASSWORD: d3BwYXNzd29yZA==
  MYSQL_ROOT_PASSWORD: cm9vdHBhc3N3b3Jk
