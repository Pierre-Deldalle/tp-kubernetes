apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
spec:
  serviceName: mysql
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
      - name: mysql
        image: mysql:9.0
        ports:
        - containerPort: 3306
          name: mysql
        # MYSQL_USER et MYSQL_DATABASE depuis la ConfigMap
        # MYSQL_PASSWORD et MYSQL_ROOT_PASSWORD depuis le Secret
        envFrom:
        - configMapRef:
            name: mysql-configmap
        - secretRef:
            name: mysql-secret
        volumeMounts:
        - name: mysql-data
          mountPath: /var/lib/mysql
  # Stockage persistant : un PVC est créé automatiquement pour chaque pod du StatefulSet
  volumeClaimTemplates:
  - metadata:
      name: mysql-data
    spec:
      accessModes: ["ReadWriteOnce"]
      resources:
        requests:
          storage: 1Gi
