apiVersion: apps/v1
kind: Deployment
metadata:
  name: wordpress
spec:
  replicas: 1
  selector:
    matchLabels:
      app: blog
  template:
    metadata:
      labels:
        app: blog
    spec:
      containers:
      - name: wordpress
        image: wordpress:latest
        ports:
        - containerPort: 80
        env:
        # Depuis la ConfigMap MySQL (déployée dans le namespace middle)
        - name: WORDPRESS_DB_USER
          valueFrom:
            configMapKeyRef:
              name: mysql-configmap
              key: MYSQL_USER
        - name: WORDPRESS_DB_NAME
          valueFrom:
            configMapKeyRef:
              name: mysql-configmap
              key: MYSQL_DATABASE
        # <service-mysql>.<namespace-mysql>.svc.cluster.local
        - name: WORDPRESS_DB_HOST
          value: mysql.database.svc.cluster.local
        # Depuis le Secret MySQL (déployé dans le namespace middle)
        - name: WORDPRESS_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: mysql-secret
              key: MYSQL_PASSWORD
        # Port local utilisé par le port-forward vers Nginx : 8080
        - name: WORDPRESS_CONFIG_EXTRA
          value: |
            define('WP_HOME','http://localhost:8080');
            define('WP_SITEURL','http://localhost:8080');
        volumeMounts:
        - name: wordpress-data
          mountPath: /var/www/html
      volumes:
      - name: wordpress-data
        persistentVolumeClaim:
          claimName: wordpress-pvc
