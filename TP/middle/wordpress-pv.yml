# Un PersistentVolume n'appartient à aucun namespace (ressource de niveau cluster)
apiVersion: v1
kind: PersistentVolume
metadata:
  name: wordpress-pv
spec:
  storageClassName: manual
  capacity:
    storage: 100Mi
  accessModes:
    - ReadWriteMany
  hostPath:
    path: /tmp/kubernetes/wordpress
    type: DirectoryOrCreate
